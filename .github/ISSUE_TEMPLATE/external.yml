name: External dependency
description: Something we need from someone outside the team
type: External
body:
  - type: markdown
    attributes:
      value: |
        **Title:** the thing we need. Example: *Snapchat credentials for the pilot client.*
        **Sidebar:** fill **Waiting on**, **Asked on** (today), and **Needed by** in the fields on the right. Those drive the Blockers view.
  - type: textarea
    id: request
    attributes:
      label: What we need
      description: Written so the other party can act on it without a meeting. Specific items, names, URLs.
      placeholder: "Identity provider configured for paa-app: client ID and secret, redirect URI for the live URL, and the domain rule for who counts as a media team member."
    validations:
      required: true
  - type: input
    id: blocks
    attributes:
      label: Blocks
      description: The outcomes or decisions that can't finish without this.
      placeholder: "#41, #43"
    validations:
      required: true