name: Decision
description: A question that gates work
type: Decision
body:
  - type: markdown
    attributes:
      value: |
        **Title:** the question. Example: *Editing model: free-form cells or structured actions only.*
        **Sidebar:** fill **Owner** and **Needed by** in the fields on the right. Those drive the Decisions view.
  - type: textarea
    id: options
    attributes:
      label: Options
      description: One line each. Include the option you don't like.
      value: |
        - 
        - 
    validations:
      required: true
  - type: input
    id: recommendation
    attributes:
      label: Recommendation
      description: One line. Which option and the main reason.
    validations:
      required: true
  - type: input
    id: blocks
    attributes:
      label: Blocks
      placeholder: "#31, #34"
  - type: markdown
    attributes:
      value: |
        Closes when `docs/decisions/NNN-<title>.md` is merged.